# Generated by Compass from compass.config.json. Edit that file, then run `compass sync`.
name: compass

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the staleness check reads git history
      - uses: actions/checkout@v4
        with:
          repository: EdwardBatt/Compass
          path: .compass-tool
          ref: v0.3.1 # the Compass version this project is pinned to
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .compass-tool/bin/compass.mjs lint
